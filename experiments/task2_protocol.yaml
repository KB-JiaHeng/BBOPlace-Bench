protocol_version: 4
status: frozen
frozen_at: "2026-07-24"
approval: >-
  The user approved Task 2 on the upstream-native adaptec1 512-macro subset,
  deferred the full 543-macro instance to Task 3, selected CPU as the formal
  backend, approved the 2026-07-24 validity-remediation plan, and requested the
  protocol-v4 evidence-scope corrections after an independent audit. Formal
  launch remains blocked until an artifact-bound automatic smoke decision verifies the
  exact current experiment definition. Any failed or ambiguous gate blocks the
  formal experiment and requires discussion.

scope:
  task: 2
  purpose: >-
    Extend the frozen Task 1 MGO experiment to a controlled bi-objective
    macro-placement baseline, compare NSGA-II with the explicitly frozen MOEA/D
    variant, and collect diagnostic evidence needed to select a Task 3 target.
  formal_comparison: [nsga2, moead]
  excludes:
    - Task 1 crossover-mutation factorial repetition
    - custom survival or random exploration slots
    - repair, resampling, or immigration after decoder failure
    - Lamarckian write-back
    - phenotype duplicate elimination
    - algorithm-specific parameter tuning
    - full-chip standard-cell placement inside the objective loop

inheritance_from_task1:
  frozen_tag: task1-frozen-v2
  benchmark: adaptec1
  benchmark_variant: adaptec1_upstream_native_top512_macro_subset
  n_macro: 512
  full_543_macro_instance_deferred_to_task3: true
  macro_selection:
    implementation: upstream_read_aux_stable_area_descending_sort
    tie_break: original_nodes_file_order
    expected_node_count: 512
    expected_net_count: 693
    expected_macro_names_sha256: 6230212160d88bc1c090b12b4a0b892953a683f9713efaf1882257c65a24b026
    expected_macro_geometry_sha256: 8a38d83d75170b5cc07dc14a4be3e95e53784b7d62ce63eeac67497121097d84
    expected_net_topology_sha256: 0f54b1517ade1b366ff21da6c7a9deda266148d10814890097a3db79f0c4de85
    expected_macro_area_sum: 63129768
    expected_canvas: [459, 459, 11151, 11139]
  placer: mgo
  net_scope: bbo_macro_placedb
  n_grid_x: 224
  n_grid_y: 224
  rank_key: area_sum
  representation: integer_mgo_guides
  inheritance_mode: baldwinian
  population_size: 20
  initial_population_size: 20
  sampling: random
  sampling_repeat: 1
  true_evaluations: 10000
  seeds: [1, 2, 3, 4, 5]
  identical_initial_population_within_seed: true
  initial_population_semantics:
    same_generation_order_between_nsga2_and_moead: true
    available_historical_task1_reference_seeds: [1]
    available_task1_seed1_genotype_set_must_match: true
    task1_seeds_2_to_5_not_claimed_as_historically_verified: true
    task1_saved_order_not_reused: >-
      The available Task 1 seed-1 artifact saved the complete sampled set after
      HPWL sorting. Task 2 preserves the original random generation order and
      verifies equality to that available historical set with an order-invariant
      hash. Seeds 2-5 remain paired between NSGA-II and MOEA/D, but are not
      claimed to have historical Task 1 artifacts.
  uniform_crossover:
    overall_probability: 1.0
    level: scalar
    exchange_probability: 0.5
    complementary_children: 2
  swap_mutation:
    individual_probability: 1.0
    swaps_per_child: 1
    unit: complete_macro_xy_pair
    distinct_indices: true
  genotype_duplicate_elimination:
    enabled: true
    semantics: run_level_genotype_hash_exclusion
    compare_entire_evaluated_history: true
    compare_current_population: true
    compare_new_offspring: true
    phenotype_duplicate_elimination: false
    retry_limit: 100
  invalid_decode:
    consumes_evaluation: true
    repair: false
    resampling: false
    objective_value: 1.0e16
    excluded_from_hv: true

objectives:
  formal: [hpwl, congestion_top10]
  auxiliary: [rudy_top10, total_overflow, max_overflow, overflow_fraction]
  hpwl:
    evaluator: cpu_comp_res
    net_scope: bbo_macro_placedb
  dreamplace_rudy:
    source: bundled_unmodified_DREAMPlace
    source_modification_allowed: false
    dtype: float32
    deterministic_flag: 1
    route_num_bins_x: 512
    route_num_bins_y: 512
    unit_horizontal_capacity: 1.5625
    unit_vertical_capacity: 1.45
    raw_map: horizontal_demand_plus_vertical_demand
    utilization_map: max_horizontal_vertical_capacity_normalized
    hotspot_fraction: 0.10
    hotspot_count_rule: ceil_fraction_times_number_of_bins
    scalar_rule: arithmetic_mean_of_largest_hotspot_bins
    wdm_degree_correction: dreamplace_kernel
    net_weights: benchmark_weight_if_present_else_one
  naming:
    rudy_top10: macro_level_dreamplace_routing_demand_proxy
    congestion_top10: macro_level_dreamplace_default_capacity_utilization_proxy

nsga2:
  parent_selection: binary_tournament_rank_then_crowding
  survival: nondominated_sorting_then_crowding_distance
  crowding: standard_crowding_distance
  population_size: 20
  offspring_target_per_generation: 20
  external_archive_affects_search: false

moead:
  reference_vectors: 20_uniformly_spaced_biobjective_vectors_including_extremes
  decomposition: normalized_weighted_tchebycheff
  neighborhood_size: 10
  parent_source: neighborhood_only
  subproblem_order: random_permutation_each_sweep
  offspring_per_subproblem: 1
  complementary_child_choice: uniform_random
  ideal_point: historical_componentwise_minimum_never_regresses
  nadir_for_replacement: current_valid_population_plus_offspring_componentwise_maximum
  replacement: every_improved_neighbor
  maximum_replacements: unlimited
  external_archive_affects_search: false

